name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ocaml ocaml-dune libqcheck-core-ocaml-dev ocaml-findlib clang libclang-rt-18-dev
          pip install pandas numpy matplotlib
      - name: Unit, property, equivalence, QCheck and 1M-op differential tests
        run: make test
      - name: AddressSanitizer and UBSan
        run: make sanitize
      - name: Coverage-guided fuzzing (short)
        run: make fuzz-libfuzzer SECS=30
      - name: Reproduce every number on synthetic data
        run: BENCH_RUNS=3 make reproduce
      - name: Fail if any seeded bug survives or anything is unexplained
        run: |
          python3 - <<'PY'
          import json
          h = json.load(open("results/headline.json"))
          s = json.load(open("results/mutants_summary.json"))
          print(h, s)
          assert h["unexplained"] == 0, "unexplained fidelity events"
          assert s["caught"] == s["total"], "a seeded bug survived"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
